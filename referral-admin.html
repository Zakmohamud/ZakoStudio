<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Referral codes — Zako Studio</title>
    <link rel="icon" type="image/png" href="images/zako-studio-logo-trim.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f7f2ea;
        --card: #fbf8f3;
        --ink: #1f1a17;
        --muted: #5f5750;
        --red: #a3201c;
        --green: #2f6b4f;
        --line: rgba(31, 26, 23, 0.2);
        --line-strong: rgba(31, 26, 23, 0.5);
        --serif: "Newsreader", Georgia, serif;
        --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px 18px; background: #ece5da; color: var(--ink); font-family: var(--sans); font-size: 15px; }
      main { width: min(1100px, 100%); margin: 0 auto; padding: clamp(20px, 4vw, 40px); background: var(--paper); border: 1px solid var(--line-strong); }
      h1, h2 { margin: 0; font-family: var(--serif); font-weight: 400; }
      h1 { font-size: clamp(34px, 5vw, 52px); }
      h2 { font-size: 28px; margin-bottom: 14px; }
      header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--ink); }
      header p { margin: 6px 0 0; color: var(--muted); }
      section { margin-top: 30px; }
      label { display: grid; gap: 5px; font-size: 13px; font-weight: 500; }
      input, select { min-height: 44px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 0; background: #fff; font: inherit; color: var(--ink); }
      button { font: inherit; cursor: pointer; }
      .btn { min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font-weight: 500; }
      .btn.red { background: var(--red); border-color: var(--red); }
      .btn.ghost { background: transparent; color: var(--ink); }
      .small { min-height: 34px; padding: 0 12px; font-size: 13px; }
      .linkish { border: 0; background: none; padding: 0; color: var(--red); text-decoration: underline; font-size: 13px; }
      .new-code { display: grid; grid-template-columns: 1.2fr 1.4fr 0.7fr 1fr auto; gap: 12px; align-items: end; padding: 18px; border: 1px solid var(--line); background: var(--card); }
      .message { min-height: 1.4em; margin: 10px 0 0; }
      .message.bad { color: var(--red); }
      .message.ok { color: var(--green); }
      table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); }
      th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
      th { font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      tr:last-child td { border-bottom: 0; }
      .code { font-weight: 600; letter-spacing: 0.04em; }
      .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 500; }
      .pill.on { background: #e3efe7; color: var(--green); }
      .pill.off { background: #eee6dc; color: var(--muted); }
      .muted { color: var(--muted); }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .table-wrap { overflow-x: auto; }
      .login { max-width: 380px; display: grid; gap: 14px; margin-top: 26px; }
      .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
      .stat { padding: 12px 16px; border: 1px solid var(--line); background: var(--card); min-width: 150px; }
      .stat b { display: block; font-family: var(--serif); font-size: 28px; font-weight: 400; }
      .filter { display: flex; gap: 10px; align-items: end; margin-bottom: 12px; flex-wrap: wrap; }
      input[type="checkbox"] { min-height: 0; width: 18px; height: 18px; accent-color: var(--green); }
      [hidden] { display: none !important; }
      @media (max-width: 760px) {
        .new-code { grid-template-columns: 1fr 1fr; }
        .new-code .btn { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Referral codes</h1>
          <p>Create codes for partners, set their discount, and see who sent you clients.</p>
        </div>
        <button class="btn ghost small" id="sign-out" hidden>Sign out</button>
      </header>

      <form class="login" id="login">
        <label>Manager password
          <input type="password" id="password" autocomplete="current-password" required />
        </label>
        <button class="btn" type="submit">Open</button>
        <p class="message" id="login-message" role="status"></p>
      </form>

      <div id="app" hidden>
        <section>
          <h2>New code</h2>
          <form class="new-code" id="new-code">
            <label>Code
              <input id="nc-code" placeholder="SARAH15" required autocapitalize="characters" style="text-transform:uppercase" />
            </label>
            <label>Partner
              <input id="nc-partner" placeholder="Sarah — Little Sprouts Daycare" required />
            </label>
            <label>% off
              <input id="nc-percent" type="number" min="1" max="90" step="1" value="15" required />
            </label>
            <label>Expires (optional)
              <input id="nc-expires" type="date" />
            </label>
            <button class="btn red" type="submit">Create code</button>
          </form>
          <p class="message" id="code-message" role="status"></p>
        </section>

        <section>
          <h2>Your codes</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Code</th><th>Partner</th><th>% off</th><th>Expires</th><th>Status</th><th>Inquiries</th><th>Booked</th><th></th></tr>
              </thead>
              <tbody id="codes-body"></tbody>
            </table>
          </div>
        </section>

        <section>
          <h2>Inquiries</h2>
          <div class="stats" id="stats"></div>
          <div class="filter">
            <label>Show
              <select id="filter">
                <option value="all">All inquiries</option>
                <option value="code">With a referral code</option>
              </select>
            </label>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Received</th><th>Client</th><th>Package</th><th>Requested</th><th>Code / partner</th><th>Heard from</th><th>Price</th><th>Booked</th><th></th></tr>
              </thead>
              <tbody id="inquiries-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      let password = "";
      try { password = sessionStorage.getItem("referral-admin") || ""; } catch {}
      let data = { codes: [], inquiries: [] };

      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const money = (n) => `$${Number.isInteger(n) ? n : Number(n).toFixed(2)}`;
      const when = (iso) => new Date(iso).toLocaleString("en-CA", { timeZone: "America/Vancouver", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

      async function api(body) {
        const res = await fetch("/api/referral-admin", {
          method: "POST",
          headers: { "content-type": "application/json", "x-admin-password": password },
          body: JSON.stringify(body)
        });
        const result = await res.json().catch(() => ({}));
        if (res.status === 401) {
          signOut();
          throw new Error("Wrong password.");
        }
        if (!res.ok) throw new Error(result.message || "Something went wrong.");
        return result;
      }

      function signOut() {
        password = "";
        try { sessionStorage.removeItem("referral-admin"); } catch {}
        $("app").hidden = true;
        $("sign-out").hidden = true;
        $("login").hidden = false;
      }

      async function load() {
        data = await api({ action: "list" });
        $("login").hidden = true;
        $("app").hidden = false;
        $("sign-out").hidden = false;
        render();
      }

      function render() {
        $("codes-body").innerHTML = data.codes.length
          ? data.codes.map((c) => `
            <tr>
              <td class="code">${esc(c.code)}</td>
              <td>${esc(c.partner)}</td>
              <td>${c.percent}%</td>
              <td>${c.expires ? esc(c.expires) : '<span class="muted">Never</span>'}</td>
              <td>${c.usable ? '<span class="pill on">Active</span>' : `<span class="pill off">${c.active === false ? "Off" : "Expired"}</span>`}</td>
              <td>${c.inquiries}</td>
              <td>${c.booked}</td>
              <td><div class="actions">
                <button class="btn ghost small" data-act="toggle" data-code="${esc(c.code)}">${c.active === false ? "Turn on" : "Turn off"}</button>
                <button class="btn ghost small" data-act="edit" data-code="${esc(c.code)}">Change %</button>
                <button class="linkish" data-act="delete" data-code="${esc(c.code)}">Delete</button>
              </div></td>
            </tr>`).join("")
          : '<tr><td colspan="8" class="muted">No codes yet. Create one above.</td></tr>';

        const list = $("filter").value === "code" ? data.inquiries.filter((i) => i.code) : data.inquiries;
        const withCode = data.inquiries.filter((i) => i.code);
        $("stats").innerHTML = `
          <div class="stat"><b>${data.inquiries.length}</b>Inquiries</div>
          <div class="stat"><b>${withCode.length}</b>With a code</div>
          <div class="stat"><b>${data.inquiries.filter((i) => i.booked).length}</b>Marked booked</div>`;

        $("inquiries-body").innerHTML = list.length
          ? list.map((i) => `
            <tr>
              <td>${when(i.createdAt)}</td>
              <td>${esc(i.name)}<br><span class="muted">${esc(i.email)}${i.phone ? " · " + esc(i.phone) : ""}</span></td>
              <td>${esc(i.package)}</td>
              <td>${esc(i.date)}<br><span class="muted">${esc(i.time)}</span></td>
              <td>${i.code ? `<span class="code">${esc(i.code)}</span><br><span class="muted">${esc(i.partner)}</span>` : '<span class="muted">—</span>'}</td>
              <td>${i.heardFrom ? esc(i.heardFrom) : '<span class="muted">—</span>'}</td>
              <td>${i.percent ? `${money(i.finalPrice)}<br><span class="muted"><s>${money(i.price)}</s> −${i.percent}%</span>` : money(i.price)}</td>
              <td><input type="checkbox" aria-label="Booked" data-act="booked" data-id="${esc(i.id)}" ${i.booked ? "checked" : ""}></td>
              <td><button class="linkish" data-act="remove" data-id="${esc(i.id)}">Remove</button></td>
            </tr>`).join("")
          : '<tr><td colspan="9" class="muted">No inquiries yet.</td></tr>';
      }

      function note(text, kind) {
        $("code-message").textContent = text;
        $("code-message").className = `message ${kind || ""}`;
      }

      $("login").addEventListener("submit", async (event) => {
        event.preventDefault();
        password = $("password").value;
        $("login-message").textContent = "Opening…";
        $("login-message").className = "message";
        try {
          await load();
          try { sessionStorage.setItem("referral-admin", password); } catch {}
          $("password").value = "";
          $("login-message").textContent = "";
        } catch (error) {
          $("login-message").textContent = error.message;
          $("login-message").className = "message bad";
        }
      });

      $("sign-out").addEventListener("click", signOut);
      $("filter").addEventListener("change", render);

      $("new-code").addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          const { code } = await api({
            action: "saveCode",
            isNew: true,
            code: $("nc-code").value,
            partner: $("nc-partner").value,
            percent: Number($("nc-percent").value),
            expires: $("nc-expires").value
          });
          event.target.reset();
          $("nc-percent").value = 15;
          note(`${code.code} created — ${code.percent}% off. Share it with ${code.partner}.`, "ok");
          await load();
        } catch (error) {
          note(error.message, "bad");
        }
      });

      document.addEventListener("click", async (event) => {
        const el = event.target.closest("[data-act]");
        if (!el || el.dataset.act === "booked") return;
        const code = data.codes.find((c) => c.code === el.dataset.code);
        try {
          if (el.dataset.act === "toggle" && code) {
            await api({ action: "saveCode", ...code, active: code.active === false });
          } else if (el.dataset.act === "edit" && code) {
            const value = prompt(`New discount for ${code.code} (1–90):`, code.percent);
            if (value === null) return;
            await api({ action: "saveCode", ...code, percent: Number(value) });
            note(`${code.code} is now ${Number(value)}% off.`, "ok");
          } else if (el.dataset.act === "delete" && code) {
            if (!confirm(`Delete ${code.code}? Past inquiries keep their record, but the code will stop working.`)) return;
            await api({ action: "deleteCode", code: code.code });
          } else if (el.dataset.act === "remove") {
            if (!confirm("Remove this inquiry from the list?")) return;
            await api({ action: "deleteInquiry", id: el.dataset.id });
          } else {
            return;
          }
          await load();
        } catch (error) {
          note(error.message, "bad");
        }
      });

      document.addEventListener("change", async (event) => {
        const el = event.target;
        if (el.dataset?.act !== "booked") return;
        try {
          await api({ action: "setBooked", id: el.dataset.id, booked: el.checked });
          await load();
        } catch (error) {
          el.checked = !el.checked;
          note(error.message, "bad");
        }
      });

      if (password) load().catch(() => signOut());
    </script>
  </body>
</html>
